<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pace">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<title>Pace-Rechner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --text:#1c1c1e; --muted:#6e6e73; --line:#e6e3dd; --soft:#f0eee9;
  --run:#1f9d55; --swim:#1e7fd6; --bike:#e2711d; --tri:#7a4fd6; --t:#9a9aa0;
  --accent:var(--run);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141416; --card:#1f1f22; --text:#f2f2f4; --muted:#9a9aa2; --line:#2e2e33; --soft:#28282c;
    --run:#3cc47a; --swim:#4aa3f0; --bike:#f08a3a; --tri:#9d7bf0; --t:#6d6d74; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.view{display:none}
.view.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h1{font-size:28px;margin:4px 2px 14px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
h1 .dot{width:12px;height:12px;border-radius:50%;background:var(--accent)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;
  padding:9px 4px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg-label{font-size:13px;color:var(--muted);margin:0 2px 6px}
.field{padding:10px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0;padding-top:0}
.field:last-child{padding-bottom:0}
.field.hidden{display:none}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.row{display:flex;align-items:center;gap:6px}
.row .colon{color:var(--muted);font-weight:600}
.unit{color:var(--muted);font-size:15px;margin-left:4px;white-space:nowrap}
input{font:inherit;font-size:20px;font-variant-numeric:tabular-nums;color:var(--text);background:var(--soft);
  border:1.5px solid transparent;border-radius:10px;padding:9px 10px;width:100%;min-width:0;outline:none;text-align:center}
input:focus{border-color:var(--accent);background:var(--card)}
input.w-num{max-width:130px;text-align:left}
input.w-2{max-width:64px}
.sub{font-size:11px;color:var(--muted);text-align:center;margin-top:3px}
.tgrid{display:grid;grid-template-columns:64px 12px 64px 12px 64px;align-items:center}
.tgrid.two{grid-template-columns:64px 12px 64px auto}
.tgrid .colon{text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:13px;
  padding:5px 10px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.result{background:var(--accent);color:#fff;border:0}
.result .lbl{font-size:13px;opacity:.85;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.result .big{font-size:44px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin:4px 0 2px}
.result .small{font-size:15px;opacity:.9}
.result.empty .big{font-size:20px;font-weight:600;opacity:.9}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 0;border-top:1px solid var(--line)}
tr:first-child td{border-top:0}
td:last-child{text-align:right;font-weight:600}
td .m{color:var(--muted);font-size:13px;font-weight:400;margin-left:6px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.split .field{border:0;padding:0}
.legs .leg{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.legs .leg:first-child{border-top:0}
.leg .sw{width:10px;height:10px;border-radius:3px;flex:none}
.leg .n{flex:1}
.leg .d{font-weight:600;min-width:72px;text-align:right}
.leg .c{color:var(--muted);font-size:13px;min-width:66px;text-align:right}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:14px 0 2px;background:rgba(255,255,255,.25)}
.bar span{display:block;height:100%}
.hint{font-size:13px;color:var(--muted);margin:2px 2px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:center}
nav .inner{display:flex;max-width:560px;width:100%}
nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;padding:4px 0;border-radius:10px}
nav a .ic{display:block;font-size:22px;line-height:1.2;filter:grayscale(1);opacity:.7}
nav a.on{color:var(--text)}
nav a.on .ic{filter:none;opacity:1}
</style>
</head>
<body>
<main id="app"></main>
<nav><div class="inner">
  <a href="#laufen" data-v="laufen"><span class="ic">🏃</span>Laufen</a>
  <a href="#schwimmen" data-v="schwimmen"><span class="ic">🏊</span>Schwimmen</a>
  <a href="#rad" data-v="rad"><span class="ic">🚴</span>Rad</a>
  <a href="#triathlon" data-v="triathlon"><span class="ic">🏁</span>Triathlon</a>
</div></nav>

<script>
(function(){
const STORE='pace-rechner-v1';
let saved={};
try{ saved=JSON.parse(localStorage.getItem(STORE)||'{}')||{}; }catch(e){ saved={}; }
function persist(){ try{ localStorage.setItem(STORE,JSON.stringify(saved)); }catch(e){} }

const $=id=>document.getElementById(id);
const num=v=>{ v=String(v??'').trim().replace(',','.'); return v===''?NaN:parseFloat(v); };
const int=v=>{ const n=num(v); return isNaN(n)?0:n; };
const pad=n=>String(n).padStart(2,'0');
const fmtNum=(n,d)=>n.toLocaleString('de-DE',{maximumFractionDigits:d,minimumFractionDigits:0});
function fmtTime(sec){
  if(!isFinite(sec)||sec<=0) return '–';
  sec=Math.round(sec);
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h>0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
function fmtPace(sec){
  if(!isFinite(sec)||sec<=0) return '–';
  sec=Math.round(sec);
  return `${Math.floor(sec/60)}:${pad(sec%60)}`;
}

const D={
  run:{view:'laufen',name:'Laufen',color:'--run',base:1,du:'km',pu:'/km',speed:false,
    presets:[['5 km',5],['10 km',10],['Halbmarathon',21.0975],['Marathon',42.195]],
    def:{dist:'10',pm:'5',ps:'30'},mode:'time'},
  swim:{view:'schwimmen',name:'Schwimmen',color:'--swim',base:100,du:'m',pu:'/100 m',speed:false,
    presets:[['400 m',400],['750 m',750],['1.500 m',1500],['1.900 m',1900],['3.800 m',3800]],
    def:{dist:'1500',pm:'2',ps:'00'},mode:'time'},
  bike:{view:'rad',name:'Radfahren',color:'--bike',base:1,du:'km',speed:true,
    presets:[['20 km',20],['40 km',40],['90 km',90],['180 km',180]],
    def:{dist:'40',sp:'30'},mode:'time'}
};

function timeInputs(p){
  return `<div class="tgrid">
    <div><input id="${p}h" inputmode="numeric" placeholder="0"><div class="sub">Std</div></div><span class="colon">:</span>
    <div><input id="${p}m" inputmode="numeric" placeholder="00"><div class="sub">Min</div></div><span class="colon">:</span>
    <div><input id="${p}s" inputmode="numeric" placeholder="00"><div class="sub">Sek</div></div></div>`;
}
function paceInputs(p,unit){
  return `<div class="tgrid two">
    <div><input id="${p}m" inputmode="numeric" placeholder="0"><div class="sub">Min</div></div><span class="colon">:</span>
    <div><input id="${p}s" inputmode="numeric" placeholder="00"><div class="sub">Sek</div></div>
    <span class="unit">${unit}</span></div>`;
}

const app=$('app');

/* ---------- Einzel-Rechner ---------- */
function buildDisc(k){
  const c=D[k];
  const paceField = c.speed
    ? `<label>Geschwindigkeit</label><div class="row"><input id="${k}-sp" class="w-num" inputmode="decimal" placeholder="30"><span class="unit">km/h</span></div>`
    : `<label>Pace</label>${paceInputs(k+'-p',c.pu)}`;
  const sec=document.createElement('section');
  sec.className='view'; sec.id='v-'+c.view; sec.style.setProperty('--accent',`var(${c.color})`);
  sec.innerHTML=`
    <h1><span class="dot"></span>${c.name}</h1>
    <div class="seg-label">Was willst du ausrechnen?</div>
    <div class="seg" id="${k}-seg">
      <button data-m="pace">${c.speed?'Tempo':'Pace'}</button>
      <button data-m="time">Zeit</button>
      <button data-m="dist">Strecke</button>
    </div>
    <div class="card">
      <div class="field" data-f="dist"><label>Strecke</label>
        <div class="row"><input id="${k}-dist" class="w-num" inputmode="decimal" placeholder="${c.def.dist}"><span class="unit">${c.du}</span></div>
        <div class="chips">${c.presets.map(p=>`<button class="chip" data-d="${p[1]}">${p[0]}</button>`).join('')}</div>
      </div>
      <div class="field" data-f="time"><label>Zeit</label>${timeInputs(k+'-t')}</div>
      <div class="field" data-f="pace">${paceField}</div>
    </div>
    <div class="card result" id="${k}-res"></div>
    <div class="card" id="${k}-tab"></div>`;
  app.appendChild(sec);

  // Defaults
  const setDef=(id,v)=>{ if(saved[id]===undefined) saved[id]=v; };
  setDef(k+'-dist',c.def.dist);
  if(c.speed) setDef(k+'-sp',c.def.sp); else { setDef(k+'-pm',c.def.pm); setDef(k+'-ps',c.def.ps); }
  if(!saved[k+'-mode']) saved[k+'-mode']=c.mode;

  sec.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ saved[k+'-mode']=b.dataset.m; persist(); calcDisc(k); });
  sec.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ $(k+'-dist').value=String(b.dataset.d).replace('.',','); save($(k+'-dist')); calcDisc(k); });
  sec.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>{ save(i); calcDisc(k); }));
}

function readTime(p){
  const vs=['h','m','s'].map(x=>$(p+x)?$(p+x).value.trim():'');
  if(vs.every(v=>v==='')) return NaN;
  const t=int(vs[0])*3600+int(vs[1])*60+int(vs[2]);
  return t>0?t:NaN;
}
function readPer(k){ // Sekunden pro Basis-Einheit (1 km bzw. 100 m)
  if(D[k].speed){ const sp=num($(k+'-sp').value); return sp>0?3600/sp:NaN; }
  const t=readTime(k+'-p'); return t;
}

function calcDisc(k){
  const c=D[k], mode=saved[k+'-mode'];
  const sec=$('v-'+c.view);
  sec.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  sec.querySelectorAll('.field[data-f]').forEach(f=>f.classList.toggle('hidden',f.dataset.f===mode));

  let d=num($(k+'-dist').value), t=readTime(k+'-t'), per=readPer(k);
  if(mode==='pace') per=(d>0&&t>0)? t/(d/c.base) : NaN;
  if(mode==='time') t=(d>0&&per>0)? per*d/c.base : NaN;
  if(mode==='dist') d=(t>0&&per>0)? t/per*c.base : NaN;

  // Strecken-Chips markieren
  const dv=mode==='dist'?NaN:num($(k+'-dist').value);
  sec.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',Math.abs(parseFloat(b.dataset.d)-dv)<1e-6));

  const paceTxt=()=>{
    if(k==='run') return {main:fmtPace(per)+' /km', sub:fmtNum(3600/per,1)+' km/h'};
    if(k==='swim') return {main:fmtPace(per)+' /100 m', sub:fmtPace(per*10)+' /km'};
    return {main:fmtNum(3600/per,1)+' km/h', sub:fmtPace(per)+' min/km'};
  };
  const res=$(k+'-res');
  const ok = mode==='pace'?per>0 : mode==='time'?t>0 : d>0;
  if(!ok){
    res.className='card result empty';
    res.innerHTML=`<div class="lbl">Ergebnis</div><div class="big">Fülle die beiden Felder oben aus</div>`;
  } else {
    res.className='card result';
    let lbl,main,sub;
    if(mode==='pace'){ const p=paceTxt(); lbl=c.speed?'Dein Tempo':'Deine Pace'; main=p.main; sub=p.sub; }
    if(mode==='time'){ lbl='Deine Zeit'; main=fmtTime(t); sub=paceTxt().main+' über '+fmtNum(d,c.base===100?0:3)+' '+c.du; }
    if(mode==='dist'){ lbl='Deine Strecke'; main=fmtNum(d,c.base===100?0:2)+' '+c.du; sub='in '+fmtTime(t)+' bei '+paceTxt().main; }
    res.innerHTML=`<div class="lbl">${lbl}</div><div class="big">${main}</div><div class="small">${sub}</div>`;
  }

  const tab=$(k+'-tab');
  if(per>0){
    tab.style.display='';
    tab.innerHTML=`<h2>Bei ${c.speed?'diesem Tempo':'dieser Pace'}</h2><table>${
      c.presets.map(p=>`<tr><td>${p[0]}</td><td>${fmtTime(per*p[1]/c.base)}</td></tr>`).join('')}</table>`;
  } else tab.style.display='none';
}

/* ---------- Triathlon ---------- */
const TRI=[['Supersprint',400,10,2.5],['Sprint',750,20,5],['Olympisch',1500,40,10],['Mitteldistanz',1900,90,21.1],['Langdistanz',3800,180,42.2]];
function buildTri(){
  const sec=document.createElement('section');
  sec.className='view'; sec.id='v-triathlon'; sec.style.setProperty('--accent','var(--tri)');
  sec.innerHTML=`
    <h1><span class="dot"></span>Triathlon</h1>
    <div class="card result" id="tri-res"></div>
    <div class="card">
      <h2>Distanz</h2>
      <div class="chips" style="margin:0 0 12px">${TRI.map((p,i)=>`<button class="chip" data-i="${i}">${p[0]}</button>`).join('')}</div>
      <div class="split" style="grid-template-columns:1fr 1fr 1fr">
        <div class="field"><label>🏊 Schwimmen</label><div class="row"><input id="tri-sd" inputmode="decimal"><span class="unit">m</span></div></div>
        <div class="field"><label>🚴 Rad</label><div class="row"><input id="tri-bd" inputmode="decimal"><span class="unit">km</span></div></div>
        <div class="field"><label>🏃 Laufen</label><div class="row"><input id="tri-rd" inputmode="decimal"><span class="unit">km</span></div></div>
      </div>
    </div>
    <div class="card">
      <h2>Deine Paces</h2>
      <div class="field" style="--accent:var(--swim)"><label>🏊 Schwimm-Pace</label>${paceInputs('tri-sp','/100 m')}</div>
      <div class="field" style="--accent:var(--t)"><label>Wechsel 1 (T1)</label>${paceInputs('tri-t1','min')}</div>
      <div class="field" style="--accent:var(--bike)"><label>🚴 Rad-Tempo</label><div class="row"><input id="tri-bsp" class="w-num" inputmode="decimal"><span class="unit">km/h</span></div></div>
      <div class="field" style="--accent:var(--t)"><label>Wechsel 2 (T2)</label>${paceInputs('tri-t2','min')}</div>
      <div class="field" style="--accent:var(--run)"><label>🏃 Lauf-Pace</label>${paceInputs('tri-rp','/km')}</div>
    </div>
    <p class="hint">Deine Eingaben bleiben auf diesem Gerät gespeichert.</p>`;
  app.appendChild(sec);

  const defs={'tri-sd':'1500','tri-bd':'40','tri-rd':'10','tri-spm':'2','tri-sps':'00','tri-t1m':'2','tri-t1s':'00',
    'tri-bsp':'30','tri-t2m':'1','tri-t2s':'30','tri-rpm':'5','tri-rps':'30'};
  for(const id in defs) if(saved[id]===undefined) saved[id]=defs[id];

  sec.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    const p=TRI[b.dataset.i];
    [['tri-sd',p[1]],['tri-bd',p[2]],['tri-rd',p[3]]].forEach(([id,v])=>{ $(id).value=String(v).replace('.',','); save($(id)); });
    calcTri();
  });
  sec.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>{ save(i); calcTri(); }));
}

function calcTri(){
  const sd=num($('tri-sd').value), bd=num($('tri-bd').value), rd=num($('tri-rd').value);
  const sp=readTime('tri-sp'), bsp=num($('tri-bsp').value), rp=readTime('tri-rp');
  const t1=readTime('tri-t1')||0, t2=readTime('tri-t2')||0;
  const swim=(sd>0&&sp>0)?sp*sd/100:NaN;
  const bike=(bd>0&&bsp>0)?bd/bsp*3600:NaN;
  const run=(rd>0&&rp>0)?rp*rd:NaN;

  document.querySelectorAll('#v-triathlon .chip').forEach(b=>{
    const p=TRI[b.dataset.i]; b.classList.toggle('on',p[1]===sd&&p[2]===bd&&p[3]===rd);
  });

  const legs=[
    ['Schwimmen','var(--swim)',swim,sd>0?fmtNum(sd,0)+' m':''],
    ['T1','var(--t)',t1,''],
    ['Rad','var(--bike)',bike,bd>0?fmtNum(bd,1)+' km':''],
    ['T2','var(--t)',t2,''],
    ['Laufen','var(--run)',run,rd>0?fmtNum(rd,2)+' km':'']
  ];
  const all=[swim,bike,run].every(x=>x>0);
  const total=legs.reduce((a,l)=>a+(l[2]>0?l[2]:0),0);
  let cum=0;
  const rows=legs.map(l=>{
    if(l[2]>0) cum+=l[2];
    return `<div class="leg"><span class="sw" style="background:${l[1]}"></span>
      <span class="n">${l[0]}${l[3]?` <span style="opacity:.75;font-size:13px">· ${l[3]}</span>`:''}</span>
      <span class="d">${l[2]>0?fmtTime(l[2]):(l[0].startsWith('T')?'0:00':'–')}</span>
      <span class="c">${l[2]>0?fmtTime(cum):''}</span></div>`;
  }).join('');
  const bar=total>0?legs.filter(l=>l[2]>0).map(l=>`<span style="width:${l[2]/total*100}%;background:${l[1]}"></span>`).join(''):'';
  $('tri-res').innerHTML=`
    <div class="lbl">Gesamtzeit</div>
    <div class="big">${all?fmtTime(total):'–'}</div>
    ${all?'':'<div class="small">Trag Distanzen und Paces unten ein</div>'}
    <div class="bar" style="background:rgba(255,255,255,.3)">${bar}</div>
    <div class="legs" style="margin-top:8px;color:#fff">${rows.replace(/var\(--line\)/g,'')}</div>`;
}

/* ---------- Gemeinsam ---------- */
function save(i){ saved[i.id]=i.value; persist(); }

buildDisc('run'); buildDisc('swim'); buildDisc('bike'); buildTri();
document.querySelectorAll('input[id]').forEach(i=>{ if(saved[i.id]!==undefined) i.value=saved[i.id]; });
calcDisc('run'); calcDisc('swim'); calcDisc('bike'); calcTri();

const VIEWS=['laufen','schwimmen','rad','triathlon'];
function route(){
  let v=(location.hash||'').slice(1);
  if(!VIEWS.includes(v)) v=saved.view&&VIEWS.includes(saved.view)?saved.view:'laufen';
  saved.view=v; persist();
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('active',s.id==='v-'+v));
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
})();
</script>
<style>
#tri-res .leg{border-top:1px solid rgba(255,255,255,.22)}
#tri-res .leg:first-child{border-top:0}
#tri-res .leg .c{color:rgba(255,255,255,.75)}
#tri-res .leg .sw{outline:1.5px solid rgba(255,255,255,.8)}
</style>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
